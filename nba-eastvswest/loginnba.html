<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión – NBA Conferencia Este vs Oeste</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Centrado vertical y ancho máximo del formulario */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15);
            border-radius: .5rem;
        }
        .logo-img {
            max-width: 120px;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12">
            <div class="card login-card">
                <!-- Logo opcional (puedes reemplazar la ruta) -->
                <img src="https://i.imgur.com/8Zl0XyS.png" alt="NBA Logo" class="logo-img d-block mx-auto mb-4">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Iniciar sesión</h3>

                    <!-- Formulario de login (basado en el ejemplo que diste) -->
                    <form id="loginForm" action="loginnba.php" method="post" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="ejemplo@dominio.com" required>
                            <div class="invalid-feedback">
                                Por favor ingresa un correo válido.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="••••••••" required>
                            <div class="invalid-feedback">
                                Introduce tu contraseña.
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe" name="remember">
                            <label class="form-check-label" for="rememberMe">
                                Recordarme
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <a href="reseteo-contraseña.html" class="small">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="text-center mt-3">
                        <a href="registro.html" class="small">¿No tienes cuenta? Regístrate</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS (incluye Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Validación simple del formulario (Bootstrap validation)
    (() => {
        'use strict'
        const form = document.getElementById('loginForm')
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
        }, false)
    })()
</script>
</body>
</html>
