<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro – NBA Conferencia Este vs Oeste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            display:flex;align-items:center;justify-content:center;
            min-height:100vh;background:#f8f9fa;
        }
        .register-card{
            width:100%;max-width:420px;
            padding:2rem;box-shadow:0 .5rem 1rem rgba(0,0,0,.15);
            border-radius:.5rem;
        }
        .logo-img{
            max-width:120px;margin-bottom:1.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12">
            <div class="card register-card">
                <!-- Logo opcional -->
                <img src="https://i.imgur.com/8Zl0XyS.png" alt="NBA Logo"
                     class="logo-img d-block mx-auto mb-4">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Crear cuenta</h3>

                    <form id="registerForm" action="registro.php" method="post" novalidate>
                        <div class="mb-3">
                            <label for="fullname" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="fullname" name="fullname"
                                   placeholder="Juan Pérez" required>
                            <div class="invalid-feedback">
                                Por favor ingresa tu nombre completo.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="ejemplo@dominio.com" required>
                            <div class="invalid-feedback">
                                Ingresa un correo válido.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="••••••••" minlength="6" required>
                            <div class="invalid-feedback">
                                La contraseña debe tener al menos 6 caracteres.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="confirmPassword"
                                   name="confirmPassword" placeholder="••••••••" minlength="6" required>
                            <div class="invalid-feedback">
                                Las contraseñas no coinciden.
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                            <label class="form-check-label" for="terms">
                                Acepto los <a href="#" class="text-decoration-none">términos y condiciones</a>
                            </label>
                            <div class="invalid-feedback">
                                Debes aceptar los términos para continuar.
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Registrarse</button>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <a href="loginnba.html" class="small">¿Ya tienes cuenta? Inicia sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS (incluye Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Validación personalizada: que password y confirmPassword coincidan
    (function () {
        'use strict'
        const form = document.getElementById('registerForm')
        const passwordInput = document.getElementById('password')
        const confirmInput  = document.getElementById('confirmPassword')

        form.addEventListener('submit', function (e) {
            if (!form.checkValidity()) {
                e.preventDefault()
                e.stopPropagation()
            }
            // Coincidencia de contraseñas
            if (passwordInput.value !== confirmInput.value) {
                e.preventDefault()
                confirmInput.setCustomValidity('Las contraseñas no coinciden.')
            } else {
                confirmInput.setCustomValidity('')
            }
            form.classList.add('was-validated')
        }, false)
    })()
</script>
</body>
</html>
