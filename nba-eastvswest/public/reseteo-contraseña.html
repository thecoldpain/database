<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña – NBA Conferencia Este vs Oeste</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f8f9fa;}
    .reset-card{width:100%;max-width:400px;padding:2rem;box-shadow:0 .5rem 1rem rgba(0,0,0,.15);border-radius:.5rem;}
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12">
      <div class="card reset-card">
        <div class="card-body">
          <h4 class="card-title text-center mb-4">Recuperar contraseña</h4>
          <form id="resetForm" action="reseteo-contraseña.php" method="post" novalidate>
            <div class="mb-3">
              <label for="resetEmail" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="resetEmail" name="email"
                     placeholder="ejemplo@dominio.com" required>
              <div class="invalid-feedback">Ingresa un correo válido.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar enlace de restablecimiento</button>
          </form>
          <hr class="my-4">
          <div class="text-center">
            <a href="loginnba.html" class="small">Volver al inicio de sesión</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (() => {
    'use strict';
    const form = document.getElementById('resetForm');
    form.addEventListener('submit', e => {
      if (!form.checkValidity()) {
        e.preventDefault(); e.stopPropagation();
      }
      form.classList.add('was-validated');
    }, false);
  })();
</script>
</body>
</html>
